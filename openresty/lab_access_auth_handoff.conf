# One-time browser hand-off: exchanges an opaque code for the JWT server-side,
# sets the JTI cookie, then redirects to a clean Guacamole URL.
location = /auth/access {
    access_log off;
    add_header Referrer-Policy no-referrer always;
    content_by_lua_file /etc/openresty/lua/access_code_exchange.lua;
}

# Anonymous demo hand-off.  This uses DEMO_JTI and never enters the
# reservation access-code/JTI path above.
location = /auth/demo {
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy no-referrer always;
    content_by_lua_file /etc/openresty/lua/demo_access_exchange.lua;
}

# Revoke a reservation-scoped FMU hand-off ticket during Marketplace logout.
# This exact location remains available in Lite mode; /auth/* is otherwise
# disabled there because the embedded auth service is dormant.
location = /auth/fmu/revoke {
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy no-referrer always;
    content_by_lua_file /etc/openresty/lua/fmu_session_revoke.lua;
}
