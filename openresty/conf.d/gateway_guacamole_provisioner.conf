# Gateway-local Guacamole provisioner for reservation-scoped users.
# Remote blockchain-services instances call this on Lite gateways.
location /gateway-provisioner/guacamole/ {
    access_by_lua_block {
        local expected = os.getenv("GUACAMOLE_PROVISIONER_TOKEN") or os.getenv("LAB_MANAGER_TOKEN") or ""
        local header_name = os.getenv("GUACAMOLE_PROVISIONER_TOKEN_HEADER") or "X-Guacamole-Provisioner-Token"
        local provided = ngx.req.get_headers()[header_name]
        if (not provided or provided == "") and header_name:lower() ~= "x-lab-manager-token" then
            provided = ngx.req.get_headers()["X-Lab-Manager-Token"]
        end
        if expected == "" or provided ~= expected then
            ngx.status = ngx.HTTP_UNAUTHORIZED
            ngx.header["Content-Type"] = "application/json"
            ngx.say('{"success":false,"error":"Unauthorized"}')
            return ngx.exit(ngx.HTTP_UNAUTHORIZED)
        end
    }

    proxy_set_header Host ops-worker;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $backend_ops_worker http://ops-worker:8081;
    rewrite ^/gateway-provisioner/guacamole/(.*)$ /internal/guacamole/$1 break;
    proxy_pass $backend_ops_worker;
}
