# Public, read-only lab metadata and uploaded assets generated by /lab-admin.
location /lab-content/ {
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    alias /var/www/lab-content/;
    disable_symlinks on from=/var/www/lab-content;
    try_files $uri =404;
}

# Provider-owned immutable GLB scenes are served read-only from the asset
# volume. Their source files stay in Gateway development or Station storage.
location /digital-twin-scenes/ {
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }
    if ($cors_allow_origin = "DENY") {
        return 403;
    }

    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Vary "Origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    default_type model/gltf-binary;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    alias /var/www/digital-twin-assets/;
    disable_symlinks on from=/var/www/digital-twin-assets;
    try_files $uri =404;
}

# Static Three.js applications are unpacked from validated Lab Manager uploads.
# Marketplace proxies them inside a sandboxed iframe and they contain no FMU.
location /digital-twin-apps/ {
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; sandbox allow-scripts" always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    alias /var/www/digital-twin-assets/;
    disable_symlinks on from=/var/www/digital-twin-assets;
    try_files $uri =404;
}
