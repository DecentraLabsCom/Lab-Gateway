location = /guacamole/api/tokens {
    # Credential attempts are limited both by source address (edge zone)
    # and by source address + submitted username (Lua shared counter).
    # The internal /__guacamole_tokens subrequest is not subject to this
    # public-login guard.
    limit_req zone=guac_token_login_ip burst=5 nodelay;
    limit_req_status 429;
    access_by_lua_file /etc/openresty/lua/access.lua;
    content_by_lua_file /etc/openresty/lua/guacamole_token_exchange.lua;
    client_max_body_size 5M;
    access_log off;
}
