# Loopback demo bridge, installed only by docker-compose.local-demo.yml.
location = /dev-fmu/connection {
    if ($host != "127.0.0.1") { return 404; }
    if ($request_method != POST) { return 405; }
    client_max_body_size 2k;
    access_by_lua_block {
        local file = io.open("/run/secrets/fmu_local_executor_token", "r")
        if not file then return ngx.exit(503) end
        local token = file:read("*a"); file:close()
        ngx.req.set_header("X-Local-Preview-Token", (token or ""):gsub("%s+$", ""))
    }
    proxy_set_header Host $http_host;
    set $dev_fmu_runner_upstream http://fmu-runner-local:8090/internal/dev/fmu/connection;
    proxy_pass $dev_fmu_runner_upstream;
}
location = /dev-fmu/access {
    if ($host != "127.0.0.1") { return 404; }
    if ($request_method != POST) { return 405; }
    client_max_body_size 2k;
    access_by_lua_block {
        local file = io.open("/run/secrets/fmu_local_executor_token", "r")
        if not file then return ngx.exit(503) end
        local token = file:read("*a"); file:close()
        ngx.req.set_header("X-Local-Preview-Token", (token or ""):gsub("%s+$", ""))
    }
    proxy_set_header Host $http_host;
    set $dev_fmu_runner_upstream http://fmu-runner-local:8090/internal/dev/fmu/access;
    proxy_pass $dev_fmu_runner_upstream;
}
location = /dev-fmu/simulations/stream {
    if ($host != "127.0.0.1") { return 404; }
    if ($request_method != POST) { return 405; }
    client_max_body_size 16m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    access_by_lua_block {
        local file = io.open("/run/secrets/fmu_local_executor_token", "r")
        if not file then return ngx.exit(503) end
        local token = file:read("*a"); file:close()
        ngx.req.set_header("X-Local-Preview-Token", (token or ""):gsub("%s+$", ""))
    }
    proxy_set_header Host $http_host;
    proxy_set_header X-FMU-Access-Key $http_x_fmu_access_key;
    set $dev_fmu_runner_upstream http://fmu-runner-local:8090/internal/dev/fmu/simulations/stream;
    proxy_pass $dev_fmu_runner_upstream;
}
location = /dev-fmu/sessions {
    if ($host != "127.0.0.1") { return 404; }
    if ($http_upgrade !~* ^websocket$) { return 426; }
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 600s;
    set $dev_fmu_runner_upstream http://fmu-runner-local:8090/api/v1/fmu/sessions;
    proxy_pass $dev_fmu_runner_upstream;
}
