# Proxies to BaSyx AAS Environment for public shell/submodel discovery.
# No authentication required — read-only access for Marketplace consumers.
# Only available on Full Gateway instances (docker compose --profile aas).
location /aas/ {
    access_by_lua_file /etc/openresty/lua/aas_access.lua;

    rewrite_by_lua_block {
        -- Transparently rewrite shell IDs that have an AAS link override.
        local resolver = require("aas_link_resolver")
        resolver.rewrite_if_linked()
    }

    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # CORS for Marketplace
    if ($cors_allow_origin = "DENY") {
        return 403;
    }
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'false' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Vary' 'Origin' always;
        return 204;
    }

    if ($cors_allow_origin = "DENY") {
        return 403;
    }
    if ($cors_allow_origin != "") {
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'false' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Vary' 'Origin' always;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # AAS upstream: bundled basyx-aas-server (default) or external server
    # configured via BASYX_AAS_URL in .env (set at init time in init.lua).
    set_by_lua_block $basyx_upstream {
        local config = ngx.shared.config
        return config:get("basyx_aas_url") or "http://basyx-aas-server:8081"
    }
    rewrite ^/aas/(.*)$ /$1 break;
    proxy_pass $basyx_upstream;
}
