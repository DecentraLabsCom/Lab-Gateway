# Local-only bridge for the INTO-CPS water-tank teaching preview.
# Included only by docker-compose.local-demo.yml; not used in Full/Lite production configs.
location = /dev-water-tank-fmu/describe {
    if ($host != "127.0.0.1") { return 404; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    access_by_lua_block {
        local file = io.open("/run/secrets/fmu_local_executor_token", "r")
        if not file then return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE) end
        local token = file:read("*a")
        file:close()
        token = (token or ""):gsub("%s+$", "")
        if token == "" then return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE) end
        ngx.req.set_header("X-Internal-Session-Token", token)
        ngx.req.set_header("X-FMU-Access-Key", "local-demos/into-cps-water-tank/linux64/singlewatertank-20sim.fmu")
    }

    proxy_pass http://fmu-executor-local:8091/internal/fmu/describe;
    proxy_set_header Host fmu-executor-local;
}

location = /dev-water-tank-fmu/simulations/stream {
    if ($host != "127.0.0.1") { return 404; }
    if ($request_method != POST) { return 405; }

    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_by_lua_block {
        local file = io.open("/run/secrets/fmu_local_executor_token", "r")
        if not file then return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE) end
        local token = file:read("*a")
        file:close()
        token = (token or ""):gsub("%s+$", "")
        if token == "" then return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE) end
        ngx.req.set_header("X-Internal-Session-Token", token)
        ngx.req.set_header("X-FMU-Access-Key", "local-demos/into-cps-water-tank/linux64/singlewatertank-20sim.fmu")
    }

    proxy_pass http://fmu-executor-local:8091/internal/fmu/simulations/stream;
    proxy_set_header Host fmu-executor-local;
}

location /dev-water-tank-fmu/app/ {
    if ($host != "127.0.0.1") { return 404; }
    if ($request_method != GET) { return 405; }

    access_by_lua_block {
        local file = io.open("/run/secrets/fmu_local_executor_token", "r")
        if not file then return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE) end
        local token = file:read("*a")
        file:close()
        token = (token or ""):gsub("%s+$", "")
        if token == "" then return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE) end
        ngx.req.set_header("X-Internal-Session-Token", token)
        ngx.req.set_header("X-FMU-Access-Key", "local-demos/into-cps-water-tank/linux64/singlewatertank-20sim.fmu")
    }

    rewrite ^/dev-water-tank-fmu/app/(.*)$ /internal/fmu/companion-app/$1 break;
    proxy_pass http://fmu-executor-local:8091;
    proxy_set_header Host fmu-executor-local;
}
