# Public, redacted operational status for catalogue LEDs.
location = /public/labs/status {
    add_header 'Cache-Control' 'no-store' always;
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }
    if ($cors_allow_origin = "DENY") {
        return 403;
    }
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'false' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Vary' 'Origin' always;
        return 204;
    }
    if ($cors_allow_origin != "") {
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'false' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Vary' 'Origin' always;
    }

    limit_req zone=lab_status burst=20 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Lab-Manager-Token "";
    proxy_read_timeout 5s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 5s;
    resolver 127.0.0.11 valid=30s ipv6=off;
    proxy_pass $ops_upstream$uri$is_args$args;
}
