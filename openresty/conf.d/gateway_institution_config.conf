# Institution configuration UI and provisioning token endpoints.
location = /institution-config {
    content_by_lua_block {
        local lite_mode = ngx.shared.config:get("lite_mode")
        if lite_mode == 1 or lite_mode == true or lite_mode == "1" then
            ngx.status = 403
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Forbidden: institution configuration is disabled in Lite mode.")
            return ngx.exit(403)
        end

        if ngx.var.arg_token and ngx.var.arg_token ~= "" then
            ngx.status = 400
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Query-string tokens are disabled; use the POST login form.")
            return ngx.exit(400)
        end
        return ngx.redirect("/admin-login.html?scope=billing", 302)
    }
}

location = /institution-config/login {
    content_by_lua_file /etc/openresty/lua/admin_login.lua;
}

location /institution-config/ {
    access_by_lua_file /etc/openresty/lua/billing_access.lua;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: wss:;" always;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Treat these accesses as internal so blockchain-services accepts them
    proxy_set_header X-Real-IP 127.0.0.1;
    proxy_set_header X-Forwarded-For 127.0.0.1;

    # Resolver for service discovery
    resolver 127.0.0.11 valid=5s;

    # Proxy to blockchain-services container
    set $backend_institution_config http://blockchain-services:8080;
    proxy_pass $backend_institution_config;
}
