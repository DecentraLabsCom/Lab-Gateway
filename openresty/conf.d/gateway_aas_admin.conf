# ─── AAS Admin: FMU sync ──────────────────────────────────────────
# Protected with strict LAB_MANAGER_TOKEN auth (header/cookie only, no private-network bypass)
# Proxies to fmu-runner for POST /aas-admin/fmu/{accessKey}/sync
# Only available on Full Gateway instances (docker compose --profile aas).
location /aas-admin/fmu/ {
    rewrite_by_lua_block {
        local lite_mode = ngx.shared.config:get("lite_mode")
        if lite_mode == 1 or lite_mode == true or lite_mode == "1" then
            ngx.status = 403
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Forbidden: AAS endpoints are not available in Lite mode.")
            return ngx.exit(403)
        end

        local fmu_runner_enabled = ngx.shared.config:get("fmu_runner_enabled")
        if fmu_runner_enabled == 0 or fmu_runner_enabled == false or fmu_runner_enabled == "0" then
            ngx.status = 503
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Service unavailable: FMU runner integration is disabled on this gateway.")
            return ngx.exit(503)
        end
    }
    access_by_lua_file /etc/openresty/lua/lab_manager_admin_access.lua;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Lab-Manager-Token "";
    proxy_set_header X-Ops-Internal-Token "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    client_max_body_size 50M;
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $fmu_runner_upstream http://fmu-runner:8090;
    proxy_pass $fmu_runner_upstream;
}

