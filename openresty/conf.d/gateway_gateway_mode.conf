location /gateway/mode {
    if ($request_method = 'OPTIONS') {
        return 204;
    }
    content_by_lua_block {
        local lite_mode = ngx.shared.config:get("lite_mode")
        local mode = "full"
        if lite_mode == 1 or lite_mode == true or lite_mode == "1" then
            mode = "lite"
        end
        local aas_enabled = ngx.shared.config:get("aas_enabled")
        local fmu_runner_enabled = ngx.shared.config:get("fmu_runner_enabled")
        ngx.header["Content-Type"] = "application/json"
        ngx.say(string.format(
            '{"mode":"%s","lite":%s,"aasEnabled":%s,"fmuRunnerEnabled":%s}',
            mode,
            mode == "lite" and "true" or "false",
            (aas_enabled == 1 or aas_enabled == true or aas_enabled == "1") and "true" or "false",
            (fmu_runner_enabled == 1 or fmu_runner_enabled == true or fmu_runner_enabled == "1") and "true" or "false"
        ))
    }
}
