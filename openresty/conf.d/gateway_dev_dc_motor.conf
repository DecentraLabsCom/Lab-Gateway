# Local-only DC motor companion-app asset delivery. FMU execution uses the generic local session bridge.
location /dev-dc-motor-fmu/app/ {
    if ($host != "127.0.0.1") { return 404; }
    if ($request_method != GET) { return 405; }

    access_by_lua_block {
        local file = io.open("/run/secrets/fmu_local_executor_token", "r")
        if not file then return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE) end
        local token = file:read("*a")
        file:close()
        token = (token or ""):gsub("%s+$", "")
        if token == "" then return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE) end
        ngx.req.set_header("X-Internal-Session-Token", token)
        ngx.req.set_header("X-FMU-Access-Key", "local-demos/dc-motor/linux64/DC_motor.fmu")
    }

    rewrite ^/dev-dc-motor-fmu/app/(.*)$ /internal/fmu/companion-app/$1 break;
    proxy_pass http://fmu-executor-local:8091;
    proxy_set_header Host fmu-executor-local;
}
