# Provider-owned Digital Twin asset uploads. The browser authenticates to
# OpenResty with LAB_MANAGER_TOKEN and the asset is written by fmu-runner.
location ~ ^/lab-admin/digital-twin-assets/(?<digital_twin_lab_id>[0-9]+)$ {
    set $digital_twin_asset_upload 1;
    rewrite_by_lua_block {
        local fmu_runner_enabled = ngx.shared.config:get("fmu_runner_enabled")
        if fmu_runner_enabled == 0 or fmu_runner_enabled == false or fmu_runner_enabled == "0" then
            ngx.status = 503
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Service unavailable: FMU runner integration is disabled on this gateway.")
            return ngx.exit(503)
        end
    }
    access_by_lua_file /etc/openresty/lua/lab_manager_admin_access.lua;

    rewrite ^/lab-admin/digital-twin-assets/[0-9]+$ /admin/digital-twin-assets/$digital_twin_lab_id break;
    proxy_set_header Host fmu-runner;
    proxy_set_header X-Real-IP 127.0.0.1;
    proxy_set_header X-Forwarded-For 127.0.0.1;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Lab-Manager-Token "";
    proxy_set_header X-Ops-Internal-Token "";
    client_max_body_size 50m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $fmu_runner_upstream http://fmu-runner:8090;
    proxy_pass $fmu_runner_upstream;
}

# Import a same-stem GLB or static Three.js application beside an FMU. The
# runner reads Gateway storage in development or fetches it from the
# authenticated Station endpoint in production.
location ~ ^/lab-admin/digital-twin-assets/([0-9]+)/from-fmu$ {
    set $digital_twin_asset_upload 1;
    rewrite_by_lua_block {
        local fmu_runner_enabled = ngx.shared.config:get("fmu_runner_enabled")
        if fmu_runner_enabled == 0 or fmu_runner_enabled == false or fmu_runner_enabled == "0" then
            ngx.status = 503
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Service unavailable: FMU runner integration is disabled on this gateway.")
            return ngx.exit(503)
        end
    }
    access_by_lua_file /etc/openresty/lua/lab_manager_admin_access.lua;

    rewrite ^/lab-admin/digital-twin-assets/([0-9]+)/from-fmu$ /admin/digital-twin-assets/$1/from-fmu break;
    proxy_set_header Host fmu-runner;
    proxy_set_header X-Real-IP 127.0.0.1;
    proxy_set_header X-Forwarded-For 127.0.0.1;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Lab-Manager-Token "";
    proxy_set_header X-Ops-Internal-Token "";
    client_max_body_size 4k;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $fmu_runner_upstream http://fmu-runner:8090;
    proxy_pass $fmu_runner_upstream;
}

# Lab publishing admin API. The browser authenticates to OpenResty with
# LAB_MANAGER_TOKEN. Full mode defaults to the embedded blockchain-services
# backend. Lite mode requires an explicit LAB_ADMIN_BACKEND_URL so the
# sensitive on-chain execution backend remains opt-in.
location /lab-admin/ {
    set $backend_lab_admin "";
    access_by_lua_file /etc/openresty/lua/lab_manager_admin_access.lua;

    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP 127.0.0.1;
    proxy_set_header X-Forwarded-For 127.0.0.1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # /lab-admin is a same-origin browser call to OpenResty, then an
    # internal proxy call to blockchain-services. Do not let Spring apply
    # browser CORS rules to that internal hop.
    proxy_set_header Origin "";

    client_max_body_size 12M;
    proxy_read_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    resolver 127.0.0.11 valid=5s;
    proxy_pass $backend_lab_admin;
}
