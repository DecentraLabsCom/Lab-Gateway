# Lab publishing admin API. The browser authenticates to OpenResty with
# LAB_MANAGER_TOKEN. Full mode defaults to the embedded blockchain-services
# backend. Lite mode requires an explicit LAB_ADMIN_BACKEND_URL so the
# sensitive on-chain execution backend remains opt-in.
location /lab-admin/ {
    set $backend_lab_admin "";
    access_by_lua_file /etc/openresty/lua/lab_manager_admin_access.lua;

    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP 127.0.0.1;
    proxy_set_header X-Forwarded-For 127.0.0.1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # /lab-admin is a same-origin browser call to OpenResty, then an
    # internal proxy call to blockchain-services. Do not let Spring apply
    # browser CORS rules to that internal hop.
    proxy_set_header Origin "";

    client_max_body_size 12M;
    proxy_read_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    resolver 127.0.0.11 valid=5s;
    proxy_pass $backend_lab_admin;
}
