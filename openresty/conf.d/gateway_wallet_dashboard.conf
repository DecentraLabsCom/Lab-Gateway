# Wallet and Billing admin dashboard routes.
# The dashboard is disabled in Lite mode and proxies authenticated browser
# requests to the static dashboard served by blockchain-services.
location = /wallet-dashboard {
    access_by_lua_file /etc/openresty/lua/billing_access.lua;
    content_by_lua_block {
        local lite_mode = ngx.shared.config:get("lite_mode")
        if lite_mode == 1 or lite_mode == true or lite_mode == "1" then
            ngx.status = 403
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Forbidden: wallet dashboard is disabled in Lite mode.")
            return ngx.exit(403)
        end

        if ngx.var.arg_token and ngx.var.arg_token ~= "" then
            ngx.status = 400
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Query-string tokens are disabled; use the POST login form.")
            return ngx.exit(400)
        end
        return ngx.redirect("/wallet-dashboard/", 302)
    }
}

location = /wallet-dashboard/login {
    content_by_lua_file /etc/openresty/lua/admin_login.lua;
}

location /wallet-dashboard/ {
    access_by_lua_file /etc/openresty/lua/billing_access.lua;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com; style-src-attr 'none'; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https: wss:;" always;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    # Proxy configuration for blockchain-services static dashboard
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Resolver for service discovery
    resolver 127.0.0.11 valid=5s;

    # Proxy to blockchain-services container (Spring Boot serves static from /) (using variable for dynamic resolution)
    set $backend_wallet_dash http://blockchain-services:8080;
    proxy_pass $backend_wallet_dash;
}
