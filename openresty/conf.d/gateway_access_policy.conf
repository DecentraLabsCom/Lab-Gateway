# Marketplace server-side access-policy evaluation API.
# The backend still enforces the short-lived Marketplace service JWT and scope.
location ^~ /access-policy/ {
    access_by_lua_block {
        local lite_mode = ngx.shared.config:get("lite_mode")
        if lite_mode == 1 or lite_mode == true or lite_mode == "1" then
            ngx.status = 403
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Forbidden: access-policy endpoints are disabled in Lite mode.")
            return ngx.exit(403)
        end
    }

    limit_req zone=access_policy burst=20 nodelay;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    client_max_body_size 1M;

    resolver 127.0.0.11 valid=5s;
    set $backend_access_policy http://blockchain-services:8080;
    proxy_pass $backend_access_policy;
}
