# Lab Manager routes.
# The exact bootstrap and access-policy locations remain adjacent to the
# protected static UI route so their guards and fallback stay explicit.

location = /lab-manager {
    access_by_lua_file /etc/openresty/lua/lab_manager_access.lua;
    content_by_lua_block {
        if ngx.var.arg_token and ngx.var.arg_token ~= "" then
            ngx.status = 400
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Query-string tokens are disabled; use the POST login form.")
            return ngx.exit(400)
        end
        return ngx.redirect("/lab-manager/", 302)
    }
}

location = /lab-manager/login {
    content_by_lua_file /etc/openresty/lua/admin_login.lua;
}

location = /lab-manager/access-policy {
    access_by_lua_file /etc/openresty/lua/lab_manager_access.lua;
    default_type application/json;
    content_by_lua_block {
        local function env_bool(name, default)
            local value = os.getenv(name)
            if value == nil or value == "" then
                return default
            end
            value = tostring(value):lower()
            return value == "true" or value == "1" or value == "yes" or value == "on"
        end

        local function json_bool(value)
            return value and "true" or "false"
        end

        local function json_string(value)
            value = tostring(value or "")
            value = value:gsub("\\", "\\\\"):gsub('"', '\\"')
            return '"' .. value .. '"'
        end

        local local_only = env_bool("ADMIN_DASHBOARD_LOCAL_ONLY", true)
        local allow_private = env_bool("ADMIN_DASHBOARD_ALLOW_PRIVATE", false)
        local private_networks = env_bool("SECURITY_ALLOW_PRIVATE_NETWORKS", false)
        local configured_cidrs = os.getenv("ADMIN_ALLOWED_CIDRS") or ""

        ngx.say("{"
            .. "\"dashboardLocalOnly\":" .. json_bool(local_only) .. ","
            .. "\"dashboardAllowPrivate\":" .. json_bool(allow_private and private_networks) .. ","
            .. "\"allowPrivateNetworks\":" .. json_bool(private_networks) .. ","
            .. "\"dashboardAllowedCidrs\":" .. json_string(configured_cidrs)
            .. "}")
    }
}

location /lab-manager/ {
    access_by_lua_file /etc/openresty/lua/lab_manager_access.lua;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: wss:;" always;
    root /var/www/html;
    index index.html;
    try_files $uri $uri/ /lab-manager/index.html;
}
