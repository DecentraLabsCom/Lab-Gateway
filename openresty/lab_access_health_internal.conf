# Internal helpers for aggregated health
location = /__health_blockchain {
    internal;
    proxy_set_header Host blockchain-services;
    resolver 127.0.0.11 valid=5s;
    set $backend_blockchain_health http://blockchain-services:8080/health;
    proxy_pass $backend_blockchain_health;
}

location = /__health_guacamole {
    internal;
    proxy_set_header Host guacamole;
    resolver 127.0.0.11 valid=5s;
    set $backend_guacamole_health http://guacamole:8080/guacamole/;
    proxy_pass $backend_guacamole_health;
}

location = /__health_guac_api {
    internal;
    proxy_set_header Host guacamole;
    resolver 127.0.0.11 valid=5s;
    set $backend_guacamole_api_health http://guacamole:8080/guacamole/api/tokens;
    proxy_pass $backend_guacamole_api_health;
}

# The browser-facing Guacamole token exchange must complete durable token
# registration before the auth token is exposed. content_by_lua may use
# subrequests/cosockets; response filters may not.
location = /__guacamole_tokens {
    internal;
    proxy_set_header Host guacamole;
    resolver 127.0.0.11 valid=5s;
    set $backend_guacamole_tokens http://guacamole:8080/guacamole/api/tokens;
    proxy_pass $backend_guacamole_tokens;
}

location = /__health_ops {
    internal;
    proxy_set_header Host ops-worker;
    resolver 127.0.0.11 valid=5s;
    proxy_pass $ops_health_upstream;
}

location = /__health_fmu_runner {
    internal;
    proxy_set_header Host fmu-runner;
    resolver 127.0.0.11 valid=5s;
    set $fmu_health_upstream http://fmu-runner:8090/health;
    proxy_pass $fmu_health_upstream;
}

location = /__health_aas {
    internal;
    access_by_lua_file /etc/openresty/lua/aas_access.lua;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set_by_lua_block $aas_health_upstream {
        local config = ngx.shared.config
        return (config:get("basyx_aas_url") or "http://basyx-aas-server:8081") .. "/shells"
    }
    proxy_pass $aas_health_upstream;
}
