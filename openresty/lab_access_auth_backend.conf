location /auth {
    access_by_lua_block {
        local lite_mode = ngx.shared.config:get("lite_mode")
        if lite_mode == 1 or lite_mode == true or lite_mode == "1" then
            ngx.status = 403
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Forbidden: auth endpoints are disabled in Lite mode.")
            return ngx.exit(403)
        end
    }

    # Handle preflight requests
    # A denied origin is rejected before this block; never reflect the
    # client-supplied Origin as a substitute for the allowlist result.
    if ($cors_allow_origin = "DENY") {
        return 403;
    }
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Vary' 'Origin' always;
        return 204;
    }

    # Enable CORS for authentication endpoints
    if ($cors_allow_origin = "DENY") {
        return 403;
    }
    if ($cors_allow_origin != "") {
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Vary' 'Origin' always;
    }

    # Proxy configuration for blockchain-services
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Timeout configuration for blockchain operations. Authorization
    # pending is returned immediately; the timeout only bounds the final
    # provider activation/delegation call and never a chain-polling loop.
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # Buffer configuration
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    # JSON payload size limit
    client_max_body_size 1M;

    # Resolver for service discovery
    resolver 127.0.0.11 valid=5s;

    # Proxy to blockchain-services container (using variable for dynamic resolution)
    set $backend_auth http://blockchain-services:8080;
    proxy_pass $backend_auth;
}
