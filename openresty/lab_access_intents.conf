# Intent endpoints (institutional intents ingress).
location = /intents {
    access_by_lua_block {
        local lite_mode = ngx.shared.config:get("lite_mode")
        if lite_mode == 1 or lite_mode == true or lite_mode == "1" then
            ngx.status = 403
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Forbidden: intents endpoint is disabled in Lite mode.")
            return ngx.exit(403)
        end
    }
    return 307 /intents/;
}

location /intents/ {
    access_by_lua_block {
        local lite_mode = ngx.shared.config:get("lite_mode")
        if lite_mode == 1 or lite_mode == true or lite_mode == "1" then
            ngx.status = 403
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("Forbidden: intents endpoint is disabled in Lite mode.")
            return ngx.exit(403)
        end
    }

    if ($cors_allow_origin = "DENY") {
        return 403;
    }
    if ($cors_allow_origin != "") {
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, x-api-key' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Vary' 'Origin' always;
    }

    # Rate limiting
    limit_req zone=intents burst=10 nodelay;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    client_max_body_size 1M;

    resolver 127.0.0.11 valid=5s;
    set $backend_intents http://blockchain-services:8080;
    proxy_pass $backend_intents;
}
