# AAS ID Resolution - internal subrequest only
# Called by aas_link_resolver.lua via ngx.location.capture to resolve
# whether a shell ID has an AAS link override configured.
location = /internal/aas-resolve {
    internal;
    if ($fmu_runner_enabled = 0) {
        return 503;
    }
    proxy_pass_request_headers off;
    proxy_read_timeout 2s;
    proxy_connect_timeout 1s;
    proxy_send_timeout 1s;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $fmu_resolve_upstream http://fmu-runner:8090/aas-admin/resolve-aas-id;
    proxy_pass $fmu_resolve_upstream;
}
