lua_package_path "/usr/local/openresty/site/lualib/resty/?.lua;/usr/local/lib/luarocks/share/lua/5.1/?.lua;/etc/openresty/lua/?.lua;/etc/openresty/lua/?/init.lua;;";

# Basic rate limiting for /intents (30 req/min per IP; burst 10)
limit_req_zone $binary_remote_addr zone=intents:10m rate=30r/m;

# Rate limiting for /fmu/ simulation API.
# Tuned to avoid false positives in normal UI/test bursts.
limit_req_zone $binary_remote_addr zone=fmu_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=session_observation:10m rate=60r/m;

# Lua code to initialize config variables and to read the public key of the auth service from a file
init_by_lua_file /etc/openresty/lua/init.lua;

# Lua code to periodically check for expired sessions and terminate active connections
init_worker_by_lua_file /etc/openresty/lua/init_worker.lua;

server {
    listen       80;
    # This gateway has one virtual host. Keep the Nginx vhost static; the
    # canonical SERVER_NAME remains available to Lua through the environment.
    server_name  _;
    # Redirect to HTTPS with smart port handling (omits :443 for standard port)
    set_by_lua_block $https_redirect {
        local config = ngx.shared.config
        local port = config:get("https_port")
        if port == "443" then
            return "https://" .. ngx.var.host .. ngx.var.request_uri
        else
            return "https://" .. ngx.var.host .. ":" .. port .. ngx.var.request_uri
        end
    }
    location /.well-known/pki-validation/ {
        root /var/www/html;
        allow all;
        # Uncomment next line for HTTP server validation and get an SSL certificate issued
        #autoindex on;
    }

    location = /.well-known/public-key.pem {
        # Serve only the key belonging to the configured gateway mode.
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        content_by_lua_block {
            local lite_mode = ngx.shared.config:get("lite_mode")
            local path = (lite_mode == 1 or lite_mode == true or lite_mode == "1")
                and "/etc/ssl/private/public_key.pem"
                or "/etc/openresty/jwt-keys/public_key.pem"
            local f = io.open(path, "r")
            if f then
                local content = f:read("*all")
                f:close()
                if content and content ~= "" then
                    ngx.print(content)
                    return
                end
            end
            ngx.exit(404)
        }
    }
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 $https_redirect;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # CORS allowlist for browser clients (comma-separated origins).
    set_by_lua_block $cors_allow_origin {
        local origin = ngx.var.http_origin
        if not origin or origin == "" then
            return ""
        end

        local function trim(value)
            return (value:gsub("^%s*(.-)%s*$", "%1"))
        end
        origin = trim(origin)
        if origin:sub(-1) == "/" then
            origin = origin:sub(1, -2)
        end

        -- Build allowed origins list: CORS_ALLOWED_ORIGINS or fallback to MARKETPLACE_URL + same-origin
        local allowed = os.getenv("CORS_ALLOWED_ORIGINS") or ""
        local config = ngx.shared.config
        local server_name = config:get("server_name") or "localhost"
        
        if allowed == "" then
            -- Fallback: allow MARKETPLACE_URL and same-origin
            local marketplace_url = os.getenv("MARKETPLACE_URL") or "https://marketplace-decentralabs.vercel.app"
            local https_port = config:get("https_port") or "443"
            local port_segment = (https_port == "443") and "" or (":" .. https_port)
            local same_origin = "https://" .. server_name .. port_segment
            allowed = marketplace_url .. "," .. same_origin
        end
        
        -- ALWAYS ensure the gateway's own origin is allowed (regardless of CORS_ALLOWED_ORIGINS setting)
        -- This is critical for same-site cross-origin requests (e.g., ceremony page → API)
        local host_origin = "https://" .. (ngx.var.host or server_name)
        if not allowed:find(host_origin, 1, true) then
            if allowed == "" then
                allowed = host_origin
            else
                allowed = allowed .. "," .. host_origin
            end
        end

        for entry in allowed:gmatch("([^,]+)") do
            local candidate = trim(entry)
            if candidate:sub(-1) == "/" then
                candidate = candidate:sub(1, -2)
            end
            if candidate == "*" then
                return origin
            end
            if candidate ~= "" and candidate == origin then
                return origin
            end
        end

        return "DENY"
    }

    ssl_certificate /etc/ssl/private/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer always;
    add_header X-XSS-Protection "1; mode=block";

    access_log /dev/stdout gateway_sanitized;
    set_by_lua_block $ops_upstream {
        local base = os.getenv("OPS_API_URL") or "http://ops-worker:8081"
        if base:sub(-1) == "/" then
            base = base:sub(1, -2)
        end
        return base
    }
    set_by_lua_block $ops_health_upstream {
        local base = os.getenv("OPS_API_URL") or "http://ops-worker:8081"
        if base:sub(-1) == "/" then
            base = base:sub(1, -2)
        end
        return base .. "/health"
    }
    set_by_lua_block $fmu_runner_enabled {
        local enabled = ngx.shared.config:get("fmu_runner_enabled")
        if enabled == 1 or enabled == true or enabled == "1" then
            return "1"
        end
        return "0"
    }

location = /.well-known/public-key.pem {
        # Serve only the key belonging to the configured gateway mode.
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        content_by_lua_block {
            local lite_mode = ngx.shared.config:get("lite_mode")
            local path = (lite_mode == 1 or lite_mode == true or lite_mode == "1")
                and "/etc/ssl/private/public_key.pem"
                or "/etc/openresty/jwt-keys/public_key.pem"
            local f = io.open(path, "r")
            if f then
                local content = f:read("*all")
                f:close()
                if content and content ~= "" then
                    ngx.print(content)
                    return
                end
            end
            ngx.exit(404)
        }
    }

location = /.well-known/openid-configuration {
        access_by_lua_block {
            local lite_mode = ngx.shared.config:get("lite_mode")
            if lite_mode == 1 or lite_mode == true or lite_mode == "1" then
                ngx.status = 403
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("Forbidden: OpenID discovery is disabled in Lite mode.")
                return ngx.exit(403)
            end
        }

        if ($cors_allow_origin = "DENY") {
            return 403;
        }
        if ($cors_allow_origin != "") {
            add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Vary' 'Origin' always;
        }

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        resolver 127.0.0.11 valid=5s;
        set $backend_oidc http://blockchain-services:8080/.well-known/openid-configuration;
        proxy_pass $backend_oidc;
    }

    location / {
        root /var/www/html;
        index index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: wss:;" always;
        try_files $uri $uri/ =404;
    }










    # Lab Manager UI and access-policy routes
    include /etc/openresty/lab_access_lab_manager.conf;

    # Lab publishing admin API.
    include /etc/openresty/lab_access_lab_admin.conf;

    # Public, read-only lab metadata and uploaded assets generated by /lab-admin.
    include /etc/openresty/lab_access_lab_content.conf;

    # Narrow public ingress used by remote Lite gateways. Blockchain Services
    # accepts only a short-lived JWT signed by the gateway-specific observer
    # credential; the administrator token is deliberately not valid here.
    location = /access-audit/internal/session-observed {
        if ($request_method != POST) {
            return 405;
        }
        limit_req zone=session_observation burst=20 nodelay;
        client_max_body_size 32k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        resolver 127.0.0.11 valid=5s;
        set $backend_session_observation http://blockchain-services:8080;
        proxy_pass $backend_session_observation;
    }

    # Narrow public ingress used by remote Lite reservation orchestrators.
    # The backend validates the gateway-specific token and accessURI scope;
    # OpenResty only forwards the protected headers to the Full backend.
    location = /reservations/projection {
        if ($request_method != GET) {
            return 405;
        }
        limit_req zone=session_observation burst=10 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Gateway-ID $http_x_gateway_id;
        proxy_set_header X-Reservation-Projection-Token $http_x_reservation_projection_token;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        resolver 127.0.0.11 valid=5s;
        set $backend_reservation_projection http://blockchain-services:8080;
        proxy_pass $backend_reservation_projection;
    }

    # Blockchain Services - Authentication microservice
    include /etc/openresty/lab_access_auth_backend.conf;
    include /etc/openresty/lab_access_auth_handoff.conf;

    # Wallet & Billing Admin Dashboard (static files)
    # Ensure both /wallet-dashboard and /wallet-dashboard/ work.
    include /etc/openresty/lab_access_wallet_dashboard.conf;

    # Institution configuration UI + provisioning token endpoints.
    include /etc/openresty/lab_access_institution_config.conf;

    # Shared administrator session and login page routes.
    include /etc/openresty/lab_access_admin_session.conf;

    # Billing API endpoints
    # Admin endpoints require the access token guard.
    # Billing admin and read-only service routes
    include /etc/openresty/lab_access_billing.conf;

    # Wallet API endpoints
    include /etc/openresty/lab_access_wallet.conf;

    # WebAuthn Onboarding endpoints (user credential registration)
    include /etc/openresty/lab_access_onboarding_webauthn.conf;

    # Intent endpoints (institutional intents ingress).
    include /etc/openresty/lab_access_intents.conf;

    # Lab Station ops worker (health, WoL, WinRM proxy, heartbeat poller)
    include /etc/openresty/lab_access_ops.conf;

    # Public liveness is intentionally generic. Detailed backend health is
    # available only to operators at /health/details.
    location = /health {
        content_by_lua_file /etc/openresty/lua/public_health.lua;
    }

    location = /health/details {
        access_by_lua_file /etc/openresty/lua/health_details_access.lua;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Lab-Manager-Token "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        resolver 127.0.0.11 valid=5s;
        set $backend_blockchain_health http://blockchain-services:8080/health;
        proxy_pass $backend_blockchain_health;
    }

    # Public aggregate is redacted; diagnostics require an operator token.
    location = /gateway/health {
        if ($cors_allow_origin = "DENY") {
            return 403;
        }
        if ($cors_allow_origin != "") {
            add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
            add_header 'Vary' 'Origin' always;
        }
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        content_by_lua_file /etc/openresty/lua/public_health.lua;
    }

    location = /gateway/health/details {
        access_by_lua_file /etc/openresty/lua/health_details_access.lua;
        content_by_lua_file /etc/openresty/lua/gateway_health.lua;
    }

    include /etc/openresty/lab_access_gateway_mode.conf;

    include /etc/openresty/lab_access_health_internal.conf;


    include /etc/openresty/lab_access_guacamole_auth.conf;

    include /etc/openresty/lab_access_guacamole_proxy.conf;

    # ─── AAS Public Read API ──────────────────────────────────────────
    include /etc/openresty/lab_access_aas_public.conf;

    include /etc/openresty/lab_access_guacamole_provisioner.conf;

    include /etc/openresty/lab_access_aas_admin.conf;

    # ─── AAS ID Resolution — internal subrequest only ─────────────────
    # Called by aas_link_resolver.lua via ngx.location.capture to resolve
    # whether a shell ID has an AAS link override configured.
    include /etc/openresty/lab_access_aas_resolve.conf;

    # ─── FMU Simulation API ────────────────────────────────────────────
    # Proxies requests to the fmu-runner service.
    # JWT validation is enforced by fmu-runner itself (Bearer token/JWKS).
    include /etc/openresty/lab_access_fmu.conf;
}
