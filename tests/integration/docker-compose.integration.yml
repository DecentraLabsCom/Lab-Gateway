services:
  # Deterministic Marketplace authority used by the vertical demo gate. It
  # models the canonical publication -> sanitation -> catalogue -> eligibility
  # contract without depending on a public RPC or a deployed Vercel project.
  marketplace:
    build:
      context: ./mocks/marketplace
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "13000:3000"

  # Mock blockchain-services with rate limiting and auth endpoints
  blockchain-services:
    build:
      context: ./mocks/blockchain-services
      dockerfile: Dockerfile
    environment:
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=30
      - RATE_LIMIT_BURST=10
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  guacamole:
    build:
      context: ./mocks/guacamole
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # The aggregate Gateway health checks the guacd TCP control plane even when
  # the HTTP Guacamole service is mocked.
  guacd:
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache netcat-openbsd >/dev/null && exec nc -lk -p 4822"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822"]
      interval: 5s
      timeout: 3s
      retries: 3

  openresty:
    build:
      context: ../../openresty
      dockerfile: Dockerfile
    environment:
      GUAC_ADMIN_USER: admin
      GUAC_ADMIN_PASS: secret
      SERVER_NAME: localhost
      HTTPS_PORT: "18443"
      HTTP_PORT: "18080"
      GUAC_API_URL: http://guacamole:8080/guacamole/api
      AUTH_SERVICE_URL: http://blockchain-services:8080
      MARKETPLACE_URL: http://marketplace:3000
      DEMO_USER: demo-lab-42
      DEMO_LAB_ID: "42"
      DEMO_CONNECTION_ID: "1"
      DEMO_SESSION_TTL_SECONDS: "5"
      DEMO_RATE_LIMIT_PER_MINUTE: "10"
      DEMO_PENDING_LEASE_SECONDS: "30"
      AUTH_ACCESS_CODE_REDEEMER_TOKEN: integration-redeemer-token
      OPS_API_URL: http://ops-worker:5001
      LAB_MANAGER_TOKEN: integration-test-secret
      OPS_INTERNAL_AUTH_TOKEN: integration-ops-internal-secret
      OPS_INTERNAL_AUTH_HEADER: X-Ops-Internal-Token
      ADMIN_DASHBOARD_ALLOW_PRIVATE: "true"
      SECURITY_ALLOW_PRIVATE_NETWORKS: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./certs:/etc/ssl/private
      - ../../openresty/lab_access.conf:/etc/openresty/lab_access.conf:ro
      - ../../openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../../openresty/lua:/etc/openresty/lua:ro
      - ../../web:/var/www/html:ro
      - ./lab-content:/var/www/lab-content:ro
    ports:
      - "18443:443"
      - "18080:80"
    depends_on:
      guacamole:
        condition: service_healthy
      guacd:
        condition: service_healthy
      blockchain-services:
        condition: service_healthy
      marketplace:
        condition: service_healthy
      ops-worker:
        condition: service_healthy
      fmu-runner:
        condition: service_started
    command: sh -c "sleep 2 && /usr/local/openresty/bin/openresty -g 'daemon off;'"

  ops-worker:
    build:
      context: ./mocks/ops-worker
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "5001:5001"

  fmu-runner:
    image: hashicorp/http-echo:0.2.3
    command: ["-listen=:8090", "-text=fmu-runner-ok"]
